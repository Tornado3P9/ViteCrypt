[package]
name = "ViteCrypt"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced_dialog = "0.14.0"
tokio = { version = "1.52.3", features = ["fs"] }
rfd = "0.17.2"
smol_str = "0.2.2"

# Encrytion
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.10.1"
rand_core = "0.10.0"
zeroize = "1.5"
thiserror = "2.0.18"
bs58 = "0.5.1"

# QR Code Generation
image = "0.25.6"
qrcodegen = "1.8.0"
rqrr = "0.10.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
