<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0f1113"/>

  <!-- Window frame centered -->
  <g transform="translate(160,120)">
    <rect width="1600" height="840" rx="14" fill="#0b0c0d" stroke="#1f2224" stroke-width="1"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="1600" height="56" rx="14 14 0 0" fill="#0f1113"/>
    <g transform="translate(16,16)">
      <circle cx="8" cy="8" r="8" fill="#ff5f57"/>
      <circle cx="36" cy="8" r="8" fill="#ffbd2e"/>
      <circle cx="64" cy="8" r="8" fill="#28c840"/>
    </g>
    <text x="96" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" fill="#d7d9db">Encrypt</text>

    <!-- Main split layout -->
    <g transform="translate(24,96)">
      <!-- Left control column -->
      <rect x="0" y="0" width="544" height="720" rx="10" fill="#0b0c0d" stroke="#1f2224"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont" font-size="15" fill="#c7c9cb">Controls</text>

      <!-- Password field -->
      <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont" font-size="13" fill="#c7c9cb">Password</text>
      <rect id="password-box" x="24" y="88" width="496" height="44" rx="8" fill="#0d1012" stroke="#26292b"/>
      <text id="password-placeholder" x="40" y="116" font-family="-apple-system, BlinkMacSystemFont" font-size="13" fill="#7e8184">••••••••</text>
      <rect x="512" y="98" width="28" height="24" rx="4" fill="#151617"/>

      <!-- Confirm Password -->
      <text x="24" y="156" font-family="-apple-system, BlinkMacSystemFont" font-size="13" fill="#c7c9cb">Confirm Password</text>
      <rect id="confirm-box" x="24" y="164" width="496" height="44" rx="8" fill="#0d1012" stroke="#26292b"/>
      <text id="confirm-placeholder" x="40" y="192" font-family="-apple-system, BlinkMacSystemFont" font-size="13" fill="#7e8184">••••••••</text>

      <!-- Spacer -->
      <rect x="24" y="228" width="496" height="1" fill="#151617" opacity="0.6"/>

      <!-- Generate password button (fills both password fields, masked by default) -->
      <rect id="generate-button" x="24" y="244" width="220" height="44" rx="8" fill="#14aaf0"/>
      <text x="134" y="272" font-family="-apple-system, BlinkMacSystemFont" font-size="15" fill="#fff" text-anchor="middle">Generate password</text>

      <!-- Buttons stacked (moved down to accommodate generator) -->
      <rect x="24" y="312" width="496" height="48" rx="8" fill="#0f6fff"/>
      <text x="272" y="344" font-family="-apple-system, BlinkMacSystemFont" font-size="16" fill="#fff" text-anchor="middle">Encrypt</text>

      <rect x="24" y="376" width="496" height="48" rx="8" fill="#2b2f33" stroke="#2f3336"/>
      <text x="272" y="408" font-family="-apple-system, BlinkMacSystemFont" font-size="16" fill="#d7d9db" text-anchor="middle">Decrypt</text>

      <rect x="24" y="440" width="496" height="48" rx="8" fill="#2b2f33" stroke="#3a3d40"/>
      <text x="272" y="472" font-family="-apple-system, BlinkMacSystemFont" font-size="16" fill="#d7d9db" text-anchor="middle">Clear</text>

      <!-- Small notes -->
      <text x="24" y="536" font-family="-apple-system, BlinkMacSystemFont" font-size="12" fill="#9aa0a6">Password strength: Good</text>
      <text x="24" y="556" font-family="-apple-system, BlinkMacSystemFont" font-size="12" fill="#9aa0a6">Passwords match</text>

      <!-- Right editor column -->
      <g transform="translate(576,0)">
        <rect x="0" y="0" width="1000" height="720" rx="10" fill="#0c0d0e" stroke="#232526"/>
        <!-- Toolbar above editor -->
        <rect x="12" y="12" width="976" height="44" rx="8" fill="#0b0c0d" stroke="#1f2224"/>
        <g fill="#9aa0a6" font-family="-apple-system, BlinkMacSystemFont" font-size="13">
          <text x="32" y="38">Paste</text>
          <text x="92" y="38">Copy</text>
          <text x="152" y="38">Import</text>
          <text x="224" y="38">Export</text>
        </g>

        <!-- Large TextEdit -->
        <rect x="12" y="68" width="976" height="628" rx="8" fill="#0b0c0d" stroke="#1f2224"/>
        <text x="36" y="100" font-family="-apple-system, BlinkMacSystemFont" font-size="16" fill="#8b8f93">Enter text to encrypt / paste ciphertext here</text>
        <!-- Sample lines -->
        <g fill="#6b6e71" font-family="-apple-system, BlinkMacSystemFont" font-size="14">
          <text x="36" y="140">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</text>
          <text x="36" y="170">This is a sample plaintext or ciphertext area for testing.</text>
          <text x="36" y="200">Supports multiline input, copy, paste, import/export.</text>
        </g>
      </g>

    </g>

    <!-- Footer -->
    <text x="24" y="816" font-family="-apple-system, BlinkMacSystemFont" font-size="12" fill="#6b6e71">Shortcuts: ⌘Enter encrypt • ⌥Enter decrypt • Esc clear</text>
  </g>
</svg>
